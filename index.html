<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="TapList — the unofficial guide for the Washington Brewers Festival."
    />

    <!--
      The catalog + datasets are fetched cross-origin from the standalone data
      site on first load (see VITE_DATA_BASE_URL). Warm the connection so the
      TLS/TCP handshake overlaps app startup instead of blocking the catalog
      fetch. No-op in dev, where data is same-origin.
    -->
    <link rel="preconnect" href="https://borzilleri.net" crossorigin />

    <!--
      PWA head links. vite-plugin-pwa injects <link rel="manifest"> automatically
      but doesn't touch the other PWA head tags, so they live here. Theme color
      matches manifest.theme_color and the app's --color-accent.
    -->
    <meta name="theme-color" content="#b8651b" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TapList" />

    <title>TapList</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
