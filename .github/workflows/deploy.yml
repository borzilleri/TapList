name: Deploy to GitHub Pages

# Deploys fire when a GitHub Release is published (skipping prereleases),
# or on manual dispatch — the dispatch path is the rollback / hotfix
# escape hatch and lets you deploy any existing tag (or the current
# branch HEAD if no tag is supplied).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.0.0). Leave empty to deploy the current ref (main).'
        required: false
        type: string

# Only one deploy at a time. Cancel an in-progress run if a newer commit lands.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Skip prereleases on the release trigger; manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # On release: github.event.release.tag_name is the published tag.
          # On dispatch with a tag input: that tag wins.
          # On dispatch with no input: the expression collapses to empty,
          # and actions/checkout falls back to the default github.ref (main).
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # Site is served from the custom domain taplist.rampant.io at the
      # apex, so assets resolve under "/" (vite.config.ts defaults to "/"
      # when VITE_BASE_PATH is unset). The CNAME file in public/ is what
      # tells GitHub Pages to keep the custom domain wired across
      # workflow-based deploys.
      # Production loads festival data from the standalone data site (GitHub
      # Pages) so catalog/dataset updates publish without redeploying the app.
      # Unset elsewhere (dev/tests), the app falls back to the bundled
      # public/data/ dev fixture.
      - name: Build
        run: npm run build
        env:
          VITE_DATA_BASE_URL: https://borzilleri.net/taplist-data
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
